services:
  pg:
    container_name: postgres
    image: postgres:18.1
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=app
    ports:
      - '5433:5432'
  redis:
    container_name: redis
    image: redis:8.6.1
    restart: always
    ports:
      - '6379:6379'
