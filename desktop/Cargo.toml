[workspace]
resolver = "2"
members = [
  "crates/buffer",
  "crates/syntax",
  "crates/editor",
  "crates/git",
  "crates/gfm_markdown_viewer",
  "crates/terminal",
  "crates/ui",
  "crates/workspace",
  "crates/reviu",
]

[workspace.package]
version = "0.0.11"
edition = "2024"
publish = false

[workspace.dependencies]
# External crates
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", features = [
  "font-kit",
  "x11",
  "wayland",
  "runtime_shaders",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", branch = "main" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", branch = "main" }
reqwest_client = { git = "https://github.com/zed-industries/zed", package = "reqwest_client" }
unicode-segmentation = "1.12"
ropey = "1.6"
dirs = "5.0"
tree-sitter-highlight = "0.25"
tree-sitter = "0.25"
tree-sitter-astro-next = "0.1.1"
tree-sitter-bash = "0.25.1"
tree-sitter-go = "0.23.4"
tree-sitter-c = "0.24.1"
tree-sitter-cmake = "0.7.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-elixir = "0.3.4"
tree-sitter-java = "0.23.5"
tree-sitter-julia = "0.23.1"
tree-sitter-kotlin-sg = "0.4.0"
tree-sitter-lua = "0.4.1"
tree-sitter-make = "1.1.1"
tree-sitter-sequel = "0.3.8"
tree-sitter-dart-orchard = "0.3.2"
tree-sitter-svelte-next = "0.1.1"
tree-sitter-rust = "0.24"
tree-sitter-ruby = "0.23.1"
tree-sitter-scala = "0.23.4"
tree-sitter-php = "0.24.2"
tree-sitter-hcl = "1.1.0"
tree-sitter-swift = "0.7.1"
tree-sitter-zig = "1.1.2"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
tree-sitter-css = "0.25"
tree-sitter-clojure = "0.1.0"
tree-sitter-scss = "1.0"
tree-sitter-html = "0.23"
tree-sitter-dockerfile = "0.2"
tree-sitter-haskell = "0.23.1"
tree-sitter-ocaml = "0.24.2"
tree-sitter-r = "1.2.0"
tree-sitter-yaml = "0.7"
tree-sitter-xml = "0.7"
tree-sitter-python = "0.25"
tree-sitter-toml-ng = "0.7"
tree-sitter-vue = { path = "tree-sitter-vue" }
once_cell = "1.20"
git2 = { version = "0.20.1", features = [
  "vendored-libgit2",
  "vendored-openssl",
] }
parking_lot = "0.12"
smol = "2.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
blake3 = "1.5"
anyhow = "1.0"
criterion = "0.8.2"
rusqlite = { version = "0.31", features = ["bundled"] }
rust-embed = "8.11"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "cookies",
  "rustls-tls",
] }
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
comrak = "0.22"
sentry = "0.46.2"

# Workspace member crates
buffer = { path = "crates/buffer" }
syntax = { path = "crates/syntax" }
editor = { path = "crates/editor" }
git = { path = "crates/git" }
gfm_markdown_viewer = { path = "crates/gfm_markdown_viewer" }
terminal = { path = "crates/terminal" }
ui = { path = "crates/ui" }
workspace = { path = "crates/workspace" }
gpui-router = { git = "https://github.com/justjavac/gpui-router" }

[patch.crates-io]
gpui = { git = "https://github.com/zed-industries/zed" }
