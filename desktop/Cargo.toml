[workspace]
resolver = "2"
members = [
  "crates/buffer",
  "crates/syntax",
  "crates/editor",
  "crates/git",
  "crates/gfm_markdown_viewer",
  "crates/ui",
  "crates/workspace",
  "crates/reviu",
]

[workspace.package]
version = "0.0.2-beta.3"
edition = "2024"
publish = false

[workspace.dependencies]
# External crates
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
reqwest_client = { git = "https://github.com/longbridge/gpui-component" }
unicode-segmentation = "1.12"
ropey = "1.6"
dirs = "5.0"
tree-sitter-highlight = "0.25"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
tree-sitter-css = "0.25"
tree-sitter-scss = "1.0"
tree-sitter-html = "0.23"
tree-sitter-dockerfile = "0.2"
tree-sitter-yaml = "0.7"
tree-sitter-xml = "0.7"
tree-sitter-python = "0.25"
tree-sitter-toml-ng = "0.7"
tree-sitter-vue = { path = "tree-sitter-vue" }
once_cell = "1.20"
git2 = "0.20.1"
parking_lot = "0.12"
smol = "2.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
blake3 = "1.5"
anyhow = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
rust-embed = "8.11"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "cookies",
  "rustls-tls",
] }
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
comrak = "0.22"
sentry = "0.46.2"

# Workspace member crates
buffer = { path = "crates/buffer" }
syntax = { path = "crates/syntax" }
editor = { path = "crates/editor" }
git = { path = "crates/git" }
gfm_markdown_viewer = { path = "crates/gfm_markdown_viewer" }
ui = { path = "crates/ui" }
workspace = { path = "crates/workspace" }
