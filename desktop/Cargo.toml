[workspace]
resolver = "2"
members = [
  "crates/buffer",
  "crates/syntax",
  "crates/editor",
  "crates/git",
  "crates/gfm_markdown_viewer",
  "crates/terminal",
  "crates/ui",
  "crates/workspace",
  "crates/reviu",
  "crates/agent_acp",
  "crates/agent_registry",
  "crates/agent_chat_panel",
  "crates/selectable_text",
  "crates/reviu_driver",
]

[workspace.package]
version = "0.18.0"
edition = "2024"
publish = false
license-file = "../LICENSE"

[workspace.dependencies]
# External crates
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", features = [
  "font-kit",
  "x11",
  "wayland",
  "runtime_shaders",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", branch = "main" }
gpui-base = { git = "https://github.com/longbridge/gpui-component", branch = "main" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", branch = "main" }
reqwest_client = { git = "https://github.com/zed-industries/zed", package = "reqwest_client" }
unicode-segmentation = "1.13.3"
ropey = "1.6.1"
dirs = "5.0.1"
tree-sitter-highlight = "0.25"
tree-sitter = "0.25"
tree-sitter-astro-next = "0.1.1"
tree-sitter-bash = "0.25.1"
tree-sitter-go = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-cmake = "0.7.4"
tree-sitter-cpp = "0.23.4"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-elixir = "0.3.5"
tree-sitter-java = "0.23.5"
tree-sitter-julia = "0.23.1"
tree-sitter-kotlin-sg = "0.4.0"
tree-sitter-lua = "0.4.1"
tree-sitter-make = "1.1.1"
tree-sitter-sequel = "0.3.11"
cc = "1.2.67"
embed-resource = "3.0.11"
tree-sitter-svelte-next = "0.1.1"
tree-sitter-rust = "0.24.2"
tree-sitter-ruby = "0.23.1"
tree-sitter-scala = "0.23.4"
tree-sitter-php = "0.24.2"
tree-sitter-hcl = "1.1.0"
tree-sitter-swift = "0.7.3"
tree-sitter-zig = "1.1.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.3"
tree-sitter-css = "0.25"
tree-sitter-clojure = "0.1.0"
tree-sitter-scss = "1.0"
tree-sitter-html = "0.23.2"
tree-sitter-haskell = "0.23.1"
tree-sitter-ocaml = "0.24.2"
tree-sitter-r = "1.2.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-xml = "0.7"
tree-sitter-python = "0.25"
tree-sitter-toml-ng = "0.7"
tree-sitter-vue = { path = "tree-sitter-vue" }
once_cell = "1.21.4"
# git2 0.21 dropped ssh/https from its defaults; without them libgit2 builds with no
# remote transport and fetch/push fail at runtime rather than at compile time.
git2 = { version = "0.21.0", features = [
  "https",
  "ssh",
  "vendored-libgit2",
  "vendored-openssl",
] }
parking_lot = "0.12.5"
smol = "2.0.2"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
blake3 = "1.8.5"
anyhow = "1.0.104"
criterion = "0.8.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rust-embed = "8.12.0"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "json",
  "cookies",
  "multipart",
  "query",
  "rustls",
] }
sha2 = "0.10"
base64 = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = ["v4"] }
thiserror = "1.0.69"
which = "6.0.3"
comrak = "0.54"
imara-diff = "0.2.0"
# Default features route the transport through native-tls; reqwest is unified to one
# copy, so that would pull OpenSSL into our HTTP clients too.
sentry = { version = "0.49.1", default-features = false, features = [
  "backtrace",
  "contexts",
  "debug-images",
  "logs",
  "metrics",
  "panic",
  "release-health",
  "reqwest",
  "rustls",
] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
tray-icon = "0.24.2"
gtk = "0.18.2"
libloading = "0.8"
percent-encoding = "2.3.2"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
] }

# Workspace member crates
buffer = { path = "crates/buffer" }
syntax = { path = "crates/syntax" }
editor = { path = "crates/editor" }
git = { path = "crates/git" }
gfm_markdown_viewer = { path = "crates/gfm_markdown_viewer" }
terminal = { path = "crates/terminal" }
ui = { path = "crates/ui" }
workspace = { path = "crates/workspace" }
agent_acp = { path = "crates/agent_acp" }
agent_registry = { path = "crates/agent_registry" }
agent_chat_panel = { path = "crates/agent_chat_panel" }
selectable_text = { path = "crates/selectable_text" }
gpui-router = { path = "vendor/gpui-router" }

# ACP integration
agent-client-protocol = { version = "=0.11.1", features = ["unstable"] }
agent-client-protocol-schema = { version = "=0.14.0", features = ["unstable"] }
async-channel = "2.5.0"
async-process = "2.5.0"
futures = "0.3.33"
shell-words = "1.1.1"

[profile.release]
debug = "line-tables-only"

[patch.crates-io]
gpui = { git = "https://github.com/joris-gallot/zed", branch = "reviu/test-window-raw-handle", version = "=0.2.2" }
tree-sitter-scss = { git = "https://github.com/tree-sitter-grammars/tree-sitter-scss", rev = "2ef6d42e3ad7a8208900f9346f4529806ae0f9f9" }

# TestWindow raw handles return Err instead of panicking; unbreaks gpui-component's
# macOS native integrations (accessibility, autofill) in test windows.
# gpui_platform and reqwest_client ride along so the graph keeps a single http_client.
[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/joris-gallot/zed", branch = "reviu/test-window-raw-handle", version = "=0.2.2" }
gpui_platform = { git = "https://github.com/joris-gallot/zed", branch = "reviu/test-window-raw-handle" }
reqwest_client = { git = "https://github.com/joris-gallot/zed", branch = "reviu/test-window-raw-handle" }

# Strip GPL-3.0 deps (ztracing -> zlog) that gpui and sum_tree pull into the binary. See vendor/ztracing.
[patch."https://github.com/joris-gallot/zed"]
ztracing = { path = "vendor/ztracing" }
