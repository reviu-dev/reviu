[package]
name = "agent_chat_panel"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
test-support = ["agent_acp/test-support"]

[dependencies]
app_log = { workspace = true }
agent_acp = { workspace = true }
agent_registry = { workspace = true }
agent-client-protocol = { workspace = true }
anyhow = { workspace = true }
async-channel = { workspace = true }
async-process = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
dirs = { workspace = true }
imara-diff = { workspace = true }
futures = { workspace = true }
gpui = { workspace = true }
gpui-component = { workspace = true }
selectable_text = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
syntax = { workspace = true }
ui = { workspace = true }
unicode-segmentation = { workspace = true }

[dev-dependencies]
agent_registry = { workspace = true }
agent_chat_panel = { path = ".", features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }

[[bin]]
name = "stub_agent"
path = "src/bin/stub_agent.rs"
required-features = ["test-support"]
