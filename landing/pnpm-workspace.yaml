shellEmulator: true

trustPolicy: no-downgrade

# transitive via astro/vite file-watching; flagged for a provenance regression, not a takeover.
trustPolicyExclude:
  - chokidar

allowBuilds:
  # transitive via astro/vite; needs its platform binary downloaded.
  esbuild: true
  # downloads prebuilt libvips binaries for image processing.
  sharp: true
