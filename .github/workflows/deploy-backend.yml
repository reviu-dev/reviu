name: Publish Backend Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Additional Docker tag to publish
        required: false
        type: string
      push_latest:
        description: Also publish the latest tag
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  REGISTRY: dockeregistry.jorisgallot.dev
  IMAGE_NAME: reviu-backend

concurrency:
  group: publish-backend-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy_backend:
    name: Backend - Publish Image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json
          cache: true

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: backend/package.json
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
            type=raw,value=latest,enable=${{ inputs.push_latest }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger Dokploy Deployment
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_BACKEND_APP_ID: ${{ secrets.DOKPLOY_BACKEND_APP_ID }}
        run: |
          curl -X 'POST' \
          'https://dokploy.jorisgallot.dev/api/trpc/application.deploy' \
          -H 'accept: application/json' \
          -H "x-api-key: $DOKPLOY_API_KEY" \
          -H 'Content-Type: application/json' \
          -d "{
              \"json\":{
                  \"applicationId\": \"$DOKPLOY_BACKEND_APP_ID\"
              }
          }"
