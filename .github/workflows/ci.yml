name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop

      - name: Install X11/GPUI system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      - name: Clippy
        working-directory: desktop
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo fmt
        if: runner.os == 'Linux'
        working-directory: desktop
        run: cargo fmt -- --check

      # Tests shell out to `git`, which refuses to commit without an identity.
      - name: Configure git identity
        if: runner.os != 'Windows'
        run: |
          git config --global user.email "ci@reviu.dev"
          git config --global user.name "Reviu CI"

      - name: Install nextest
        if: runner.os != 'Windows'
        uses: taiki-e/install-action@314b6e93a9b2f40a64f401a23fed55603083dc69 # nextest

      # Tests assume Unix-style paths; skip Windows.
      - name: Cargo test
        if: runner.os != 'Windows'
        working-directory: desktop
        run: cargo nextest run

      - name: Git smoke tests
        if: runner.os != 'Windows'
        working-directory: desktop
        run: |
          cargo build -p reviu_driver --bins
          target/debug/reviu-git-smoke --driver-bin target/debug/reviu-driver

  website:
    name: Website
    runs-on: ubuntu-latest
    # Matches the value baked into website/Dockerfile so CI builds what ships.
    env:
      PUBLIC_BACKEND_URL: https://api.reviu.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: website/package.json

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: website/package.json
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: website
        run: pnpm typecheck

      - name: Build
        working-directory: website
        run: pnpm build
