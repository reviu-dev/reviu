name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install X11/GPUI system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      - name: Clippy
        working-directory: desktop
        run: cargo clippy -- -D warnings -A clippy::too_many_arguments -A clippy::type_complexity -A clippy::items_after_test_module -A clippy::should_implement_trait -A clippy::needless_range_loop

      - name: Cargo fmt
        if: runner.os == 'Linux'
        working-directory: desktop
        run: cargo fmt -- --check

      # Tests shell out to `git`, which refuses to commit without an identity.
      - name: Configure git identity
        if: runner.os != 'Windows'
        run: |
          git config --global user.email "ci@reviu.dev"
          git config --global user.name "Reviu CI"

      - name: Install nextest
        if: runner.os != 'Windows'
        uses: taiki-e/install-action@nextest

      # Tests assume Unix-style paths; skip Windows. Retries absorb flaky gpui async
      # tests (allow_parking + real git I/O makes the test scheduler non-deterministic).
      - name: Cargo test
        if: runner.os != 'Windows'
        working-directory: desktop
        run: cargo nextest run --retries 2

  landing:
    name: Landing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: landing/package.json

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: landing/package.json
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: landing
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: landing
        env:
          PUBLIC_BACKEND_URL: https://api.reviu.dev
        run: pnpm typecheck
