name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.gitignore'
      - renovate.json

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      backend: ${{ steps.filter.outputs.backend }}
      landing: ${{ steps.filter.outputs.landing }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            desktop:
              - 'desktop/**'
            backend:
              - 'backend/**'
            landing:
              - 'landing/**'

  desktop:
    name: Desktop
    needs: changes
    if: false
    # if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install X11/GPUI system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Cargo check
        working-directory: desktop
        run: cargo check

      # - name: Clippy
      #   working-directory: desktop
      #   run: cargo clippy -- -D warnings

      - name: Cargo fmt
        working-directory: desktop
        run: cargo fmt -- --check

      # - name: Cargo test
      #   working-directory: desktop
      #   run: cargo test

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json
          cache: true

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: backend/package.json
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: backend
        run: pnpm typecheck

      - name: Eslint
        working-directory: backend
        run: pnpm lint

  landing:
    name: Landing
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: landing/package.json
          cache: true

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: landing/package.json
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: landing
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: landing
        run: pnpm typecheck

      - name: Build
        working-directory: landing
        run: pnpm build
